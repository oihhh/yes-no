<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little question 💗</title>
<style>
:root{
  color-scheme:light;
  --bg1:#ffeaf1; --bg2:#ffc6da;
  --ink:#7d1b40; --ink-soft:#b0486f;
  --yes-a:#ff7aa5; --yes-b:#ef3566;
  --no:#d02450;
  --glass:rgba(255,255,255,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;background:linear-gradient(160deg,var(--bg1),var(--bg2));}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;height:100%;overflow:hidden;color:var(--ink);background:transparent;
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:grid;place-items:center;padding:16px;
}

/* floating hearts + bubbles */
.fx{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.b{position:absolute;bottom:-80px;opacity:0;animation:rise linear infinite;will-change:transform,opacity}
.b svg{width:100%;height:100%;fill:currentColor;display:block}
.b.heart{color:#ff6f9c}
.b.orb{border-radius:50%;border:1px solid rgba(255,255,255,.75);
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.95),rgba(255,182,206,.35) 45%,rgba(255,120,160,.14))}
@keyframes rise{
  0%{transform:translate3d(0,0,0) rotate(0);opacity:0}
  12%{opacity:var(--o)} 88%{opacity:var(--o)}
  100%{transform:translate3d(var(--dx),-120vh,0) rotate(var(--r));opacity:0}
}

/* card */
.card{
  position:relative;z-index:1;width:100%;max-width:420px;max-height:100%;
  padding:28px 20px 26px;text-align:center;border-radius:30px;
  background:var(--glass);border:1px solid rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 18px 50px -12px rgba(239,53,102,.35);
}
.face{font-size:68px;line-height:1;display:inline-block;animation:bob 2.6s ease-in-out infinite}
.face.hit{animation:hit .4s ease-out,bob 2.6s ease-in-out .4s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes hit{30%{transform:scale(1.3) rotate(-9deg)}60%{transform:scale(.88) rotate(7deg)}}
.pic{display:block;margin:0 auto;height:240px;height:min(34dvh,280px);aspect-ratio:3/4;width:auto;max-width:100%;object-fit:cover;object-position:50% 20%;border-radius:22px;border:3px solid #fff;background:#ffd3e1;box-shadow:0 12px 28px -10px rgba(239,53,102,.55)}
.pic.hit{animation:hit .4s ease-out}
h1{margin:14px 0 6px;font-size:clamp(24px,7vw,31px);line-height:1.2;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.sub{margin:0 0 22px;min-height:1.3em;color:var(--ink-soft);font-size:16px;font-weight:600}

.btns{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;width:100%}
button{
  font:inherit;font-weight:800;color:#fff;border:0;cursor:pointer;max-width:100%;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
  transition:font-size .28s cubic-bezier(.34,1.56,.64,1),transform .15s,box-shadow .2s;
}
button:active{transform:scale(.93)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
#yes{
  padding:.62em 1.5em;font-size:20px;border-radius:999px;
  background:linear-gradient(135deg,var(--yes-a),var(--yes-b));
  box-shadow:0 8px 22px -6px rgba(239,53,102,.7);
}
#no{
  padding:.7em 1.15em;font-size:17px;border-radius:999px;line-height:1.15;
  background:var(--no);box-shadow:0 6px 16px -6px rgba(208,36,80,.7);
}
#yes.full{
  position:fixed;inset:0;z-index:4;width:100%;max-width:none;border-radius:0;
  padding:env(safe-area-inset-top,0px) 12px env(safe-area-inset-bottom,0px);
  font-size:clamp(52px,17vw,110px);
  transition:none;animation:grow .35s cubic-bezier(.34,1.56,.64,1);
}
@keyframes grow{from{clip-path:circle(8% at 50% 60%)}to{clip-path:circle(150% at 50% 60%)}}
[hidden]{display:none!important}

.won .face{font-size:84px}
.won p{margin:0;font-size:18px;font-weight:600;color:var(--ink-soft);line-height:1.5}
.card{overflow-y:auto}
.card.noblur{-webkit-backdrop-filter:none;backdrop-filter:none}
.won .tiny{margin-top:12px;font-size:14px;opacity:.85}

/* bean-shaped number input */
.wrap{margin:20px auto 0;max-width:100%}
.wrap.bad{animation:shake .4s}
.wrap.bad .bean{border-color:var(--no)}
.bean{
  display:flex;align-items:center;gap:6px;padding:6px 6px 6px 20px;max-width:100%;
  border-radius:999px;background:rgba(255,255,255,.92);border:2px solid #ffb3cb;
  box-shadow:0 10px 26px -10px rgba(239,53,102,.55);
  animation:beanIn .55s .55s cubic-bezier(.34,1.56,.64,1) both;
  transition:border-color .2s,box-shadow .2s;
}
.bean:focus-within{border-color:var(--yes-b);box-shadow:0 0 0 4px rgba(255,122,165,.28),0 10px 26px -10px rgba(239,53,102,.55)}
.bean input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;font-weight:700;color:var(--ink);padding:10px 0}
.bean input::placeholder{color:#d78aa6;font-weight:600}
.go{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;font-size:21px;text-decoration:none;
  background:linear-gradient(135deg,var(--yes-a),var(--yes-b));box-shadow:0 6px 14px -5px rgba(239,53,102,.8);transition:transform .15s}
.go:active{transform:scale(.9)}
@keyframes beanIn{from{opacity:0;transform:scale(.4) translateY(18px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* confetti */
.pop{position:fixed;left:50%;top:50%;z-index:6;pointer-events:none;
  animation:pop 1.5s cubic-bezier(.12,.8,.3,1) forwards}
.pop svg{width:100%;height:100%;fill:currentColor;display:block}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:1}
  100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1);opacity:0}
}
@media (prefers-reduced-motion:reduce){.b{animation-duration:45s!important}.face{animation:none!important}}
</style>
</head>
<body>
<div class="fx" id="fx" aria-hidden="true"></div>

<main class="card" id="card">
  <section id="ask">
    <img class="pic" id="pic" alt="" width="210" height="280" decoding="async">
    <h1 id="title">Will you go out with me?</h1>
    <p class="sub" id="sub">I made this just for you</p>
    <div class="btns">
      <button id="yes" type="button">Yes 💖</button>
      <button id="no" type="button">No</button>
    </div>
  </section>

  <section id="won" class="won" hidden>
    <div class="face">🥳</div>
    <h1 id="wonTitle">YAYYY!!</h1>
    <p id="wonMsg">Best answer ever 💖<br>Drop your WhatsApp number and I’ll plan our date 🌸</p>
    <div class="wrap" id="wrap">
      <div class="bean">
        <input id="num" type="tel" inputmode="tel" autocomplete="tel" maxlength="20" placeholder="Your WhatsApp number" aria-label="Your WhatsApp number">
        <a class="go" id="go" href="https://wa.me/" target="_blank" rel="noopener" aria-label="Send my number">💌</a>
      </div>
    </div>
    <p class="tiny" id="tiny">Only I’ll see it, promise 🤞</p>
  </section>
</main>

  var ALTS = ["Smirking with hands in pockets","Looking down, sad","Hands over ears, wincing","Crying with hands pressed together, pleading","Jumping with clenched fists, furious","Pointing straight at you, glaring"];
  var NO_TEXT = ["No","Are you sure? 🤨","Really really?","Pls? 🥺","You’re breaking my heart 💔","Last chance!!"];
  var SUB     = ["I made this just for you","Okay… that kinda hurt","La la la, can’t hear you 🙉","I’m literally begging 🥹","I’m about to lose it!!","Don’t you dare say no again 👀"];
  var MAX = NO_TEXT.length; // after this many No clicks, No disappears

  var yes=$("yes"), no=$("no"), pic=$("pic"), sub=$("sub"), title=$("title");
  title.textContent = "Will you go out with me, " + NAME + "?";
  pic.src = PICS[0]; pic.alt = ALTS[0];
  PICS.forEach(function(u){ new Image().src = u; });
  $("wonTitle").textContent = "YAYYY, " + NAME + "!!";

  /* background hearts + bubbles */
  var fx = $("fx");
  for(var i=0;i<26;i++){
    var e = document.createElement("div");
    var heart = i%3 !== 0;
    var s = rnd(14,64), d = rnd(9,20);
    e.className = "b " + (heart ? "heart" : "orb");
    e.style.cssText = "left:"+rnd(-2,96).toFixed(1)+"%;width:"+s+"px;height:"+s+"px;"
      +"--o:"+rnd(.18,.55).toFixed(2)+";--dx:"+rnd(-60,60).toFixed(0)+"px;--r:"+rnd(-30,30).toFixed(0)+"deg;"
      +"animation-duration:"+d.toFixed(1)+"s;animation-delay:-"+rnd(0,d).toFixed(1)+"s;";
    if(heart){ e.innerHTML = HEART; if(i%2) e.style.filter = "blur(1.5px)"; }
    fx.appendChild(e);
  }

  function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

  var n = 0;
  function render(){
    if(n >= MAX){
      no.hidden = true;
      yes.classList.add("full"); $("card").classList.add("noblur");
      yes.style.fontSize = "";
      return;
    }
    yes.style.fontSize = (20 + n*8) + "px";
    no.style.fontSize  = Math.max(7, 17 - n*2) + "px";
    no.textContent = NO_TEXT[n];
    sub.textContent = SUB[n];
    pic.src = PICS[n]; pic.alt = ALTS[n];
    pic.classList.remove("hit"); void pic.offsetWidth; pic.classList.add("hit");
  }

  no.addEventListener("click", function(){ n++; buzz(12); render(); });

  var COLORS = ["#ff6f9c","#f0366b","#ffb3cb","#ff8fb0","#ffffff","#d02450"];
  function burst(){
    for(var i=0;i<42;i++){
      var p = document.createElement("div"), a = rnd(0,6.283), r = rnd(110,Math.min(380,innerWidth*0.9)), s = rnd(14,34);
      p.className = "pop";
      p.style.cssText = "width:"+s+"px;height:"+s+"px;color:"+COLORS[(Math.random()*COLORS.length)|0]
        +";--x:"+(Math.cos(a)*r).toFixed(0)+"px;--y:"+(Math.sin(a)*r-60).toFixed(0)+"px;--r:"+rnd(-140,140).toFixed(0)+"deg;";
      p.innerHTML = HEART;
      document.body.appendChild(p);
      setTimeout((function(el){return function(){el.remove()}})(p),1600);
    }
  }

  /* WhatsApp number bean: no backend, her number reaches you as a pre-filled WhatsApp message */
  var wrap=$("wrap"), num=$("num"), go=$("go"), wonMsg=$("wonMsg"), tiny=$("tiny");
  var TINY = tiny.textContent;
  num.addEventListener("input", function(){
    num.value = num.value.replace(/[^\d+\-\s()]/g,"");
    tiny.textContent = TINY;
  });
  num.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); go.click(); } });
  go.addEventListener("click", function(ev){
    var v = num.value.trim(), digits = v.replace(/\D/g,"");
    if(digits.length < 8 || digits.length > 15){
      ev.preventDefault();
      tiny.textContent = "Hmm, that doesn’t look like a number 🥺";
      wrap.classList.remove("bad"); void wrap.offsetWidth; wrap.classList.add("bad");
      buzz(40); num.focus();
      return;
    }
    var text = (named ? NAME + " here! " : "") + "I said YES 🥰 My WhatsApp number is " + v + " — let’s plan our date 💖";
    go.href = "https://wa.me/" + MY_NUMBER + "?text=" + encodeURIComponent(text);
    buzz(20);
    wonMsg.innerHTML = "Got it 💌<br>" + (MY_NUMBER ? "Hit send in WhatsApp and I’ll text you soon 🌸" : "WhatsApp will ask who to send it to, pick me 🌸");
    tiny.textContent = "Didn’t open? Tap the 💌 again";
  });

  yes.addEventListener("click", function(){
    yes.hidden = true; no.hidden = true;
    $("ask").hidden = true; $("won").hidden = false; $("card").classList.remove("noblur");
    buzz([20,40,20]);
    burst(); setTimeout(burst,350); setTimeout(burst,800);
  });
})();
